name: Deploy to Cloudflare Pages

# Why this exists separately from the deploy step in the data pipeline:
#
#   * This covers HUMAN pushes. Vercel and Netlify published on every push via
#     their git integrations; Cloudflare Pages direct upload does not, so
#     without this, editing the page and pushing would publish nothing until the
#     next scheduled pipeline run.
#   * The pipeline still needs its own deploy step to cover the BOT push, since
#     GitHub deliberately does not fire workflows for commits pushed with the
#     built-in GITHUB_TOKEN.
#
# Deleting either one leaves a path that silently stops publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push landing while a deploy is in flight should supersede it, not race it.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy web --project-name=terminations --branch=main --commit-dirty=true
